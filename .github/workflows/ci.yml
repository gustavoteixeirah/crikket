name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Public placeholder URLs so Next.js / WXT builds can evaluate @crikket/env.
  # Not production secrets. Runtime config lives in Coolify.
  NEXT_PUBLIC_SITE_URL: https://crikket.kodegt.com
  NEXT_PUBLIC_APP_URL: https://crikket.kodegt.com
  NEXT_PUBLIC_SERVER_URL: https://crikket.kodegt.com
  NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
  NEXT_PUBLIC_DEMO_URL: https://crikket.kodegt.com
  VITE_APP_URL: https://crikket.kodegt.com
  VITE_SERVER_URL: https://crikket.kodegt.com

jobs:
  ci:
    name: Install, lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      # Build before typecheck: @crikket-io/capture types resolve through
      # @crikket/capture-core dist/ (package exports), which tsc --noEmit
      # does not emit.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bash ./scripts/ci-test.sh

  extension-artifact:
    name: Package extension (Load unpacked)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run --filter extension build

      - name: Zip unpacked Chrome MV3 output
        run: bash ./scripts/package-extension.sh "$GITHUB_WORKSPACE/crikket-extension-chrome-mv3.zip"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: crikket-extension-chrome-mv3
          path: crikket-extension-chrome-mv3.zip
          if-no-files-found: error
