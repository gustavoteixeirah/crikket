name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Public placeholder URLs so Next.js / WXT builds can evaluate @crikket/env.
  # Not production secrets. Runtime config lives in Coolify.
  NEXT_PUBLIC_SITE_URL: https://crikket.kodegt.com
  NEXT_PUBLIC_APP_URL: https://crikket.kodegt.com
  NEXT_PUBLIC_SERVER_URL: https://crikket.kodegt.com
  NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
  NEXT_PUBLIC_DEMO_URL: https://crikket.kodegt.com
  VITE_APP_URL: https://crikket.kodegt.com
  VITE_SERVER_URL: https://crikket.kodegt.com

jobs:
  ci:
    name: Install, lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      - name: Typecheck
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Test
        run: bun test
