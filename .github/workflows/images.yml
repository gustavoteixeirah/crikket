# Kode GT fork: build app images in GitHub Actions and push to GHCR so
# Coolify only pulls. Do not use this workflow to publish upstream images.
name: Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    if: github.repository == 'gustavoteixeirah/crikket'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: apps/web/Dockerfile
            image_suffix: crikket-web
          - service: server
            dockerfile: apps/server/Dockerfile
            image_suffix: crikket-server
          - service: proxy
            dockerfile: docker/caddy/Dockerfile
            image_suffix: crikket-proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_suffix }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/gustavoteixeirah/crikket

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://crikket.kodegt.com
            NEXT_PUBLIC_APP_URL=https://crikket.kodegt.com
            NEXT_PUBLIC_SERVER_URL=https://crikket.kodegt.com
            NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=false
            NEXT_PUBLIC_DEMO_URL=https://crikket.kodegt.com
